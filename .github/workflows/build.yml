name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile macOS library and tests (no execution)
        run: swift build --build-tests
      - name: Compile iOS library and tests (no execution)
        run: >-
          xcodebuild -scheme Orbit
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build-for-testing
